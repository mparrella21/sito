<div class="pagine pagina-gestione-ticket-operatore">

    <div class="dashboard-header">
        <h1>I Miei Interventi</h1>
        <button class="btn-refresh" id="btn-refresh" title="Ricarica Dati">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div class="stats-card">
        <div class="stats-grid">
            <div class="stat-box total">
                <div class="stat-icon"><i class="fas fa-clipboard-list"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Assegnati</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-box completed">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Completati</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="filters-card">
        <div class="filters-grid">

            <div class="filter-group">
                <label for="filter-title">Cerca per Titolo</label>
                <input type="text" id="filter-title" placeholder="Es. Manutenzione...">
            </div>

            <div class="filter-group">
                <label for="filter-status">Stato</label>
                <select id="filter-status">
                    <option value="">Tutti gli stati</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-date">Data Creazione</label>
                <input type="date" id="filter-date">
            </div>

        </div>

        <div class="filters-actions">
            <button id="btn-reset-filters" class="btn-secondary">Reset</button>
            <button id="btn-apply-filters" class="btn-primary">Applica Filtri</button>
        </div>
    </div>

    <div class="results-card">
        <div class="table-responsive">
            <table class="ticket-table">
                <thead>
                    <tr>
                        <th>Titolo</th>
                        <th>Stato</th>
                        <th>Data Assegnazione</th>
                        <th style="width: 150px; text-align: center;">Gestisci</th>
                    </tr>
                </thead>
                <tbody id="tickets-table-body">
                </tbody>
            </table>
        </div>

        <div id="tickets-loading" class="state-message">
            <div class="spinner"></div> Recupero assegnazioni...
        </div>
        <div id="tickets-empty" class="state-message hidden">
            <i class="fas fa-clipboard-check"></i> Nessun ticket assegnato trovato.
        </div>
    </div>

</div>

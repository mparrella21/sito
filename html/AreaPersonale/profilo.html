<section class="profile-card">
    <h3>Dati utente</h3>

    <form id="user-profile-form">
        <div class="form-row">
            <label>Nome</label>
            <input type="text" id="nome" disabled>
        </div>

        <div class="form-row">
            <label>Cognome</label>
            <input type="text" id="cognome" disabled>
        </div>

        <div class="form-row">
            <label>Email</label>
            <input type="email" id="email" disabled>
        </div>

        <div class="form-row">
            <label>Telefono</label>
            <input type="text" id="telefono" disabled>
        </div>

        <div class="form-row">
            <label>Data di nascita</label>
            <input type="date" id="data_nascita" disabled>
        </div>


        <div class="form-actions">
            <button type="button" id="edit-btn">Modifica</button>
            <button type="submit" id="save-btn" class="hidden">Salva</button>
            <button type="button" id="cancel-btn" class="hidden">Annulla</button>
        </div>
    </form>
</section>
